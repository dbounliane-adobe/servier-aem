version: 1

# Site query index (also set in the site's config service: content/query.yaml).
# Feeds the blog cards: blocks/article-feed (homepage) and blocks/article-list
# (/newsroom/dossiers/). Card title = the page H1 (as on servier.com); the SEO
# title stays in <title>/og:title.
indices:
  pages:
    include:
      - '/**'
    exclude:
      - '/**.json'
      - '/nav'
      - '/footer'
    target: /query-index.json
    properties:
      lastModified:
        select: none
        value: parseTimestamp(headers["last-modified"], "ddd, DD MMM YYYY hh:mm:ss GMT")
      robots:
        select: head > meta[name="robots"]
        value: attribute(el, "content")
      title:
        select: main h1
        value: textContent(el)
      description:
        select: head > meta[name="description"]
        value: attribute(el, "content")
      image:
        select: head > meta[property="og:image"]
        value: attribute(el, "content")
      imageAlt:
        select: main .article-header img
        value: attribute(el, "alt")
      date:
        select: head > meta[name="publication-date"]
        value: attribute(el, "content")
      category:
        select: head > meta[name="category"]
        value: attribute(el, "content")
      tags:
        select: head > meta[name="keywords"]
        value: attribute(el, "content")
      template:
        select: head > meta[name="template"]
        value: attribute(el, "content")
